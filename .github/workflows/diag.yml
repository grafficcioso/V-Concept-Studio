name: Diagnose (Windows)
on:
  push:
    branches: ["diag/**"]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        style: ["windows11", "windowsvista"]
        scale: ["1", "1.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Oscillation search
        env:
          QT_SCALE_FACTOR: ${{ matrix.scale }}
          DIAG_STYLE: ${{ matrix.style }}
        run: python tools/diag_oscillation.py
