name: Diagnose
on:
  push:
    branches: ["diag/**"]
jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - name: CORS preflight to OpenAI (as a browser on GitHub Pages would send)
        run: |
          for ep in images/edits images/generations responses models; do
            echo "=== OPTIONS /v1/$ep"
            curl -s -o /dev/null -D - -X OPTIONS "https://api.openai.com/v1/$ep" \
              -H "Origin: https://grafficcioso.github.io" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: authorization,content-type" | grep -iE "^HTTP|access-control" || true
          done
          echo "=== GET /v1/models with Origin (no key)"
          curl -s -o /dev/null -D - "https://api.openai.com/v1/models" -H "Origin: https://grafficcioso.github.io" | grep -iE "^HTTP|access-control" || true
