name: Diagnose (Windows)
on:
  push:
    branches: ["diag/**"]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m PyInstaller crs.spec --noconfirm --clean
      - name: EXE, update check on
        shell: pwsh
        run: ./tools/diag_exe.ps1 check
      - name: EXE, update check off
        shell: pwsh
        run: ./tools/diag_exe.ps1 nocheck
