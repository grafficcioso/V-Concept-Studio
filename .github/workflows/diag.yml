name: Diagnose (Windows)
on:
  push:
    branches: ["diag/**"]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Make a dump during an artificial stall
        id: dump
        shell: pwsh
        run: |
          $out = python tools/diag_dump.py
          $out
          $p = ($out | Select-String "DUMP_PATH=(.*)").Matches[0].Groups[1].Value
          "path=$p" >> $env:GITHUB_OUTPUT
      - name: Read the dump with cdb
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          Write-Host "cdb: $($cdb.FullName)"
          if (-not $cdb) { Write-Host "no cdb"; exit 0 }
          & $cdb.FullName -z "${{ steps.dump.outputs.path }}" -y "srv*C:\sym*https://msdl.microsoft.com/download/symbols" -c ".reload;~*k 12;q" 2>&1 | Select-Object -Last 70
      - uses: actions/upload-artifact@v4
        with:
          name: testdump
          path: ${{ steps.dump.outputs.path }}
