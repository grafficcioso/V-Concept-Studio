name: Diagnose (Windows)
on:
  push:
    branches: ["diag/**"]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scale: ["1", "1.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Glyph paint timing
        env:
          QT_SCALE_FACTOR: ${{ matrix.scale }}
        run: python tools/diag_glyphs.py
      - name: Emoji font info
        shell: pwsh
        run: Get-Item "C:\Windows\Fonts\seguiemj.ttf" | Select-Object Name, Length, @{n='Version';e={$_.VersionInfo.FileVersion}}
