# Windows EXE 빌드 + GitHub 릴리스 자동 생성
# - main 에 푸시될 때마다: 테스트 → EXE 빌드 → 기동 확인
# - crs/__init__.py 의 APP_VERSION 에 해당하는 릴리스(v X.Y.Z)가 아직 없으면 zip/sha256 을 묶어 릴리스를 게시
#   (태그도 GitHub 가 이때 만듭니다. 설치된 프로그램은 실행할 때 이 릴리스를 보고 업데이트를 안내합니다)
# - Actions 탭에서 수동 실행 가능
name: Build & Release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Read app version / check existing release
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "from crs import APP_VERSION; print(APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "release=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v already released" }
          else { "release=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v will be released" }
          $global:LASTEXITCODE = 0
      - name: Tests (offscreen, mocked network, no API cost)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build EXE
        run: python -m PyInstaller crs.spec --noconfirm --clean
      - name: Smoke test the EXE
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:CRS_CONFIG_DIR = "$env:RUNNER_TEMP\vcs_cfg"
          $env:CRS_SMOKE_QUIT_MS = "12000"
          $p = Start-Process -FilePath "dist\VConceptStudio\VConceptStudio.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Write-Error "EXE exited too early with code $($p.ExitCode)"; exit 1 }
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Error "EXE did not close"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "EXE exit code $($p.ExitCode) (crash on exit?)"; exit 1 }
          Get-Content "$env:USERPROFILE\Documents\V-Concept Studio\logs\app.log" -ErrorAction SilentlyContinue
          Write-Host "EXE started and closed cleanly"
      - name: Claude Code connection (MCP server EXE, official client, demo mode)
        run: python tools/smoke_mcp_exe.py
      - name: Post-update dialog closes without hanging (real Windows window)
        shell: pwsh
        run: ./tools/diag_exe.ps1 check
      - name: Auto-update script end-to-end (Korean path, replace files, relaunch)
        run: python tools/diag_update_script.py
      - name: Package zip + sha256
        run: python tools/package_release.py
      - name: Release notes
        run: python tools/release_notes.py v${{ steps.ver.outputs.version }} > release_notes.md
      - name: Publish GitHub release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.ver.outputs.version }}" VConceptStudio-windows.zip VConceptStudio-windows.zip.sha256 --target "${{ github.sha }}" --title "V-Concept Studio v${{ steps.ver.outputs.version }}" --notes-file release_notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: VConceptStudio-windows
          path: dist/VConceptStudio
